# Builds on detekt's default rules. Compose functions are PascalCase and take many parameters.
naming:
  # Compose files are named after their main screen or component, not their first declaration.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 16
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 120
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInClasses: 40
    thresholdInInterfaces: 40
    thresholdInFiles: 30
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 180
  ReturnCount:
    max: 4
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: true
