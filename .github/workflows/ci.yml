# Spec section 15: on every pull request run lint, detekt, unit tests, Room migration tests,
# content validation and a debug build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and detekt
        run: ./gradlew lintDevDebug detekt --continue
      - name: Unit, database and migration tests
        # Includes the user.db migration test, DAO tests and the bundled content.db check.
        run: ./gradlew :core:model:test :core:domain:test testDebugUnitTest :app:testDevDebugUnitTest
      - name: Screenshot tests (light, dark, 200% font)
        run: ./gradlew verifyRoborazziDebug
      - name: Debug build
        run: ./gradlew assembleDevDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pipeline unit tests
        run: python -m unittest discover content/tests
      - name: Validate drafts
        run: python content/pipeline/validate.py
      - name: Validate committed content.db
        run: python content/pipeline/validate.py --db app/src/main/assets/content/content.db

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
      - run: npm test
